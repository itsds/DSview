# DSView local infra.
#
# Redpanda (+ its web Console) and Redis for now — Postgres gets added here
# once the historical storage layer is built (see CLAUDE.md's architecture
# table).
#
# Redpanda exposes two listeners because it has two different kinds of
# clients to serve:
#   - "external" (localhost:9092) — for processes running on the host
#     (ingestion/, streaming/), which reach the container via the published
#     port.
#   - "internal" (redpanda:9093) — for other containers on this compose
#     network (the console below), which must address it by service name;
#     "localhost" from inside another container means that container itself,
#     not this one.
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: dsview-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9093,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9093,external://localhost:9092
    ports:
      - "9092:9092"   # Kafka API (external) — matches KAFKA_BOOTSTRAP_SERVERS in ingestion/main.py
      - "9644:9644"   # Admin API, used by `rpk` for status/topic inspection
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  console:
    image: docker.redpanda.com/redpandadata/console:v2.8.3
    container_name: dsview-redpanda-console
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9093   # internal listener — see note above
    ports:
      - "8080:8080"   # browse topics/messages/consumer groups at http://localhost:8080

  redis:
    image: redis:7.4-alpine
    container_name: dsview-redis
    ports:
      - "6379:6379"   # streaming/redis_sink.py writes here; matches CandleRedisSink's default
    # No volume: this holds only the latest candle per symbol (TTL'd, constantly
    # overwritten) — it's a serving cache, not the source of truth. Losing it on
    # restart just means a short gap until the next candle_aggregator.py batch.

  redisinsight:
    # `latest` rather than a pinned tag (unlike redpanda/console above) — no
    # confirmed-working version tag on hand; run `docker compose pull
    # redisinsight` if it ever needs a refresh.
    image: redis/redisinsight:latest
    container_name: dsview-redisinsight
    depends_on:
      - redis
    ports:
      - "5540:5540"   # UI at http://localhost:5540 — add a connection there: host "redis", port 6379
    volumes:
      - redisinsight-data:/data

volumes:
  redpanda-data:
  redisinsight-data:
