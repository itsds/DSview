# pytest config for tests/ — run it through scripts/test.sh, which starts
# (or finds) the Kafka, Redis and Postgres the suite needs and points it at
# them. See tests/conftest.py.
[pytest]
testpaths = tests
# Every service imports its siblings as bare modules from inside its own
# folder (`from schema import ...`, `from routers.push import ...`), so the
# tests put each service folder on sys.path, the way running it from that
# folder does. The repo root is there for `config.settings`, and tests/ for
# the shared helpers.
pythonpath = . tests ingestion streaming backend alerts storage backfill
# importlib: test files in different folders may share a basename.
addopts = --import-mode=importlib -ra --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# A broken push or consumer would otherwise wait forever on a socket.
timeout = 180
markers =
    spark: starts a local Spark session (slow: ~5 s once, plus ~10 s per streaming query)
filterwarnings =
    ignore::DeprecationWarning:pyspark.*
    # Newer Starlette asks for its httpx fork in TestClient; plain httpx still works.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
